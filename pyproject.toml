[project]
name = "research-mcp"
version = "0.1.0"
description = "Ask research-agent from claude.ai as your own hub user (Edward's AI Hub, spec H-007)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.3,<2",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10,<3",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.34,<1",
    "opentelemetry-sdk>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
]

[project.scripts]
research-mcp = "research_mcp.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: touches the hub or claude.ai (ask first)"]
addopts = "-m 'not live'"
